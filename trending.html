<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>热门视频 · 创作者工作台</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <script src="assets/app.js"></script>
  <script>
    let currentFilter = 'all';
    let showBreakdownId = null;
    const DATA_URL = 'https://raw.githubusercontent.com/Zangzangbaocmyk/creator-workbench/main/data/crawled_videos.json';

    // ====== 核心：打开页面自动拉取云端最新数据 ======
    async function init() {
      initPage('trending', '热门视频库', '抖音自拍vlog · 生活记录 · 每日自动更新');

      const actions = document.getElementById('page-actions');
      actions.innerHTML = `
        <button class="btn btn-ghost btn-sm" onclick="location.reload()">🔄 刷新</button>
        <button class="btn btn-primary" onclick="openAddVideoModal()">➕ 手动添加</button>
      `;

      // 显示加载中
      document.getElementById('page-content').innerHTML = `
        <div class="card">
          <div class="empty-state">
            <div class="icon">⏳</div>
            <div class="title">正在同步最新视频...</div>
            <div class="desc">从云端拉取今日推荐</div>
          </div>
        </div>
      `;

      // 强制从云端拉取（每次都拉，不缓存）
      try {
        const resp = await fetch(DATA_URL + '?v=' + Date.now());
        if (!resp.ok) throw new Error('网络错误');
        const data = await resp.json();
        
        if (Array.isArray(data) && data.length > 0) {
          // 保留用户手动添加的
          const manualVideos = Store.getVideos().filter(v => v._manual);
          Store.saveVideos(manualVideos);
          
          // 导入云端全部数据
          data.forEach(v => {
            if (!v.title) return;
            Store.addVideo({
              title: v.title,
              author: v.author || '未知',
              url: v.url || '',
              cover: v.cover || '',
              likes: v.likes || 0,
              comments: v.comments || 0,
              shares: v.shares || 0,
              views: v.views || 0,
              tags: v.tags || [],
              duration: v.duration || '',
              publishedAt: v.publishedAt || '',
              breakdown: v.breakdown || null,
            });
          });
        }
      } catch(e) {
        console.log('云端同步失败，使用本地数据:', e.message);
      }

      renderPage();
    }

    function renderPage() {
      const videos = Store.getVideos();
      const dailyVideos = videos.filter(v => v.tags && v.tags.includes('每日推荐'));
      const totalLikes = videos.reduce((s, v) => s + (v.likes || 0), 0);
      const breakdownCount = videos.filter(v => v.breakdown).length;

      const content = document.getElementById('page-content');
      content.innerHTML = `
        <!-- 今日推荐横幅 -->
        ${dailyVideos.length > 0 ? `
          <div class="card" style="border-color:var(--accent);background:linear-gradient(135deg,var(--bg-card),var(--accent-soft));margin-bottom:16px;">
            <div style="display:flex;align-items:center;justify-content:space-between;">
              <div>
                <div style="font-size:18px;font-weight:700;">🎯 今日推荐 ${dailyVideos.length} 条</div>
                <div style="font-size:13px;color:var(--text-secondary);margin-top:2px;">${new Date().toLocaleDateString('zh-CN')} · 新鲜出炉 · 直接参考二创</div>
              </div>
            </div>
          </div>
        ` : ''}

        <div class="stat-grid">
          <div class="stat-card">
            <div class="stat-label">全部视频</div>
            <div class="stat-value">${videos.length}</div>
            <div class="stat-trend">对标素材库</div>
          </div>
          <div class="stat-card green">
            <div class="stat-label">总点赞</div>
            <div class="stat-value">${Utils.formatNumber(totalLikes)}</div>
          </div>
          <div class="stat-card purple">
            <div class="stat-label">已拆解</div>
            <div class="stat-value">${breakdownCount}</div>
            <div class="stat-trend">可直接参考二创</div>
          </div>
          <div class="stat-card blue">
            <div class="stat-label">今日新增</div>
            <div class="stat-value">${dailyVideos.length}</div>
            <div class="stat-trend">每日8点自动更新</div>
          </div>
        </div>

        <div class="card" style="margin-bottom:16px;">
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn ${currentFilter === 'all' ? 'btn-primary' : 'btn-ghost'} btn-sm" onclick="setFilter('all')">全部 (${videos.length})</button>
            <button class="btn ${currentFilter === 'daily' ? 'btn-primary' : 'btn-ghost'} btn-sm" onclick="setFilter('daily')">今日推荐 (${dailyVideos.length})</button>
            <button class="btn ${currentFilter === 'breakdown' ? 'btn-primary' : 'btn-ghost'} btn-sm" onclick="setFilter('breakdown')">已拆解 (${breakdownCount})</button>
            <button class="btn ${currentFilter === 'favorite' ? 'btn-primary' : 'btn-ghost'} btn-sm" onclick="setFilter('favorite')">⭐ 收藏</button>
          </div>
        </div>

        <div class="video-grid" id="video-list">
          ${renderVideoCards()}
        </div>
      `;
    }

    function renderVideoCards() {
      let videos = Store.getVideos();
      if (currentFilter === 'daily') videos = videos.filter(v => v.tags && v.tags.includes('每日推荐'));
      else if (currentFilter === 'breakdown') videos = videos.filter(v => v.breakdown);
      else if (currentFilter === 'favorite') videos = videos.filter(v => v.favorite);

      if (videos.length === 0) {
        return `<div class="card" style="grid-column:1/-1;"><div class="empty-state"><div class="icon">🔥</div><div class="title">暂无视频</div><div class="desc">点击「刷新」从云端同步</div></div></div>`;
      }

      return videos.map(v => {
        const b = v.breakdown || {};
        const isDaily = v.tags && v.tags.includes('每日推荐');
        return `
          <div class="video-card" style="${isDaily ? 'border-color:var(--accent);' : ''}">
            ${isDaily ? '<div style="position:absolute;top:8px;left:8px;z-index:10;"><span class="badge" style="background:var(--accent);color:white;">今日推荐</span></div>' : ''}
            <div class="video-thumb">
              <div class="video-thumb-placeholder">🎬</div>
              ${v.duration ? `<div class="video-duration">${Utils.escape(v.duration)}</div>` : ''}
              ${v.favorite ? '<div style="position:absolute;top:8px;right:8px;font-size:20px;">⭐</div>' : ''}
            </div>
            <div class="video-body">
              <div class="video-title">${Utils.escape(v.title)}</div>
              <div class="video-author">
                <span>👤 ${Utils.escape(v.author)}</span>
                ${v.publishedAt ? `<span style="margin-left:auto;">${Utils.timeAgo(v.publishedAt)}</span>` : ''}
              </div>
              <div class="video-stats">
                <div class="video-stat">❤️ ${Utils.formatNumber(v.likes || 0)}</div>
                <div class="video-stat">💬 ${Utils.formatNumber(v.comments || 0)}</div>
                <div class="video-stat">🔄 ${Utils.formatNumber(v.shares || 0)}</div>
                <div class="video-stat">👁️ ${Utils.formatNumber(v.views || 0)}</div>
              </div>
              ${v.tags && v.tags.length > 0 ? `
                <div style="margin-top:8px;display:flex;gap:4px;flex-wrap:wrap;">
                  ${v.tags.filter(t => t !== '每日推荐').slice(0,3).map(t => `<span class="badge badge-info">${Utils.escape(t)}</span>`).join('')}
                </div>
              ` : ''}
              <div class="video-actions">
                ${v.url ? `<a href="${Utils.escape(v.url)}" target="_blank" class="btn btn-ghost btn-sm">▶️ 观看</a>` : ''}
                <button class="btn btn-ghost btn-sm" onclick="toggleBreakdown('${v.id}')">
                  ${v.breakdown ? '📝 拆解' : '✏️ 拆解'}
                </button>
                <button class="btn btn-ghost btn-sm" onclick="toggleFavorite('${v.id}')">${v.favorite ? '⭐' : '☆'}</button>
                <button class="btn btn-danger btn-sm" onclick="deleteVideo('${v.id}')">🗑️</button>
              </div>
              ${showBreakdownId === v.id && v.breakdown ? renderBreakdown(v) : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    function renderBreakdown(v) {
      const b = v.breakdown;
      return `
        <div class="breakdown-panel show" style="margin-top:12px;">
          <div class="breakdown-section"><div class="breakdown-label">🎯 选题角度</div><div class="breakdown-text">${Utils.escape(b.angle)}</div></div>
          <div class="breakdown-section"><div class="breakdown-label">🪝 开头钩子（前3秒）</div><div class="breakdown-text">${Utils.escape(b.hook)}</div></div>
          <div class="breakdown-section"><div class="breakdown-label">✂️ 剪辑节奏</div><div class="breakdown-text">${Utils.escape(b.rhythm)}</div></div>
          <div class="breakdown-section"><div class="breakdown-label">💡 可模仿点</div><div class="breakdown-text">${Utils.escape(b.imitate)}</div></div>
          <div class="breakdown-section"><div class="breakdown-label">⚡ 差异化建议</div><div class="breakdown-text">${Utils.escape(b.differentiate)}</div></div>
          <button class="btn btn-primary btn-sm" style="margin-top:8px;" onclick="openBreakdownModal('${v.id}')">✏️ 编辑拆解</button>
        </div>
      `;
    }

    function setFilter(f) { currentFilter = f; renderPage(); }
    function toggleBreakdown(id) { showBreakdownId = showBreakdownId === id ? null : id; renderPage(); }

    function toggleFavorite(id) {
      const v = Store.getVideos().find(x => x.id === id);
      Store.updateVideo(id, { favorite: !v.favorite });
      renderPage();
      Utils.toast(v.favorite ? '已取消收藏' : '已收藏 ⭐');
    }

    function deleteVideo(id) {
      if (confirm('确定删除？')) { Store.deleteVideo(id); renderPage(); Utils.toast('已删除'); }
    }

    function openAddVideoModal() {
      const modal = document.createElement('div');
      modal.className = 'modal-overlay show';
      modal.innerHTML = `
        <div class="modal">
          <div class="modal-header"><div class="modal-title">➕ 手动添加视频</div><button class="modal-close" onclick="this.closest('.modal-overlay').remove()">×</button></div>
          <div class="form-group"><label class="label">视频标题 *</label><input class="input" id="v-title"></div>
          <div class="form-group"><label class="label">作者</label><input class="input" id="v-author"></div>
          <div class="form-group"><label class="label">视频链接</label><input class="input" id="v-url"></div>
          <div class="form-row">
            <div class="form-group"><label class="label">点赞数</label><input class="input" id="v-likes" type="number" value="0"></div>
            <div class="form-group"><label class="label">评论数</label><input class="input" id="v-comments" type="number" value="0"></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label class="label">分享数</label><input class="input" id="v-shares" type="number" value="0"></div>
            <div class="form-group"><label class="label">播放量</label><input class="input" id="v-views" type="number" value="0"></div>
          </div>
          <div class="form-group"><label class="label">标签（逗号分隔）</label><input class="input" id="v-tags" placeholder="vlog,日常,自拍"></div>
          <div class="modal-actions">
            <button class="btn btn-ghost" onclick="this.closest('.modal-overlay').remove()">取消</button>
            <button class="btn btn-primary" onclick="submitVideo()">添加</button>
          </div>
        </div>`;
      document.body.appendChild(modal);
    }

    function submitVideo() {
      const title = document.getElementById('v-title').value.trim();
      if (!title) { Utils.toast('请输入标题', 'error'); return; }
      const tags = document.getElementById('v-tags').value.trim();
      Store.addVideo({
        title, _manual: true,
        author: document.getElementById('v-author').value.trim() || '未知',
        url: document.getElementById('v-url').value.trim(),
        likes: parseInt(document.getElementById('v-likes').value) || 0,
        comments: parseInt(document.getElementById('v-comments').value) || 0,
        shares: parseInt(document.getElementById('v-shares').value) || 0,
        views: parseInt(document.getElementById('v-views').value) || 0,
        tags: tags ? tags.split(',').map(t => t.trim()).filter(Boolean) : [],
      });
      document.querySelector('.modal-overlay').remove();
      renderPage();
      Utils.toast('视频已添加');
    }

    function openBreakdownModal(videoId) {
      const v = Store.getVideos().find(x => x.id === videoId);
      const b = v.breakdown || {};
      const modal = document.createElement('div');
      modal.className = 'modal-overlay show';
      modal.innerHTML = `
        <div class="modal" style="max-width:700px;">
          <div class="modal-header"><div class="modal-title">📝 二创拆解</div><button class="modal-close" onclick="this.closest('.modal-overlay').remove()">×</button></div>
          <div class="form-group"><label class="label">🎯 选题角度</label><textarea class="textarea" id="b-angle">${Utils.escape(b.angle||'')}</textarea></div>
          <div class="form-group"><label class="label">🪝 开头钩子</label><textarea class="textarea" id="b-hook">${Utils.escape(b.hook||'')}</textarea></div>
          <div class="form-group"><label class="label">✂️ 剪辑节奏</label><textarea class="textarea" id="b-rhythm">${Utils.escape(b.rhythm||'')}</textarea></div>
          <div class="form-group"><label class="label">💡 可模仿点</label><textarea class="textarea" id="b-imitate">${Utils.escape(b.imitate||'')}</textarea></div>
          <div class="form-group"><label class="label">⚡ 差异化建议</label><textarea class="textarea" id="b-differentiate">${Utils.escape(b.differentiate||'')}</textarea></div>
          <div class="modal-actions">
            <button class="btn btn-ghost" onclick="this.closest('.modal-overlay').remove()">取消</button>
            <button class="btn btn-primary" onclick="submitBreakdown('${videoId}')">保存</button>
          </div>
        </div>`;
      document.body.appendChild(modal);
    }

    function submitBreakdown(videoId) {
      Store.updateVideo(videoId, { breakdown: {
        angle: document.getElementById('b-angle').value.trim(),
        hook: document.getElementById('b-hook').value.trim(),
        rhythm: document.getElementById('b-rhythm').value.trim(),
        imitate: document.getElementById('b-imitate').value.trim(),
        differentiate: document.getElementById('b-differentiate').value.trim(),
      }});
      document.querySelector('.modal-overlay').remove();
      showBreakdownId = videoId;
      renderPage();
      Utils.toast('拆解已保存');
    }

    // 启动
    init();
  </script>
</body>
</html>
